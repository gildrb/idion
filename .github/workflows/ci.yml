name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Reject secret and device-state paths
        run: |
          if git ls-files | grep -E '(^|/)(authorized_keys|settings\.reader\.lua|Books|\.kobo)(/|$)|\.(epub|pdf|cbz|cbr|img|key|tgz|zip)$'; then
            echo "Secret, user-content, firmware, or generated artifact path is tracked" >&2
            exit 1
          fi
