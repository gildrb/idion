name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - name: Reject secret and device-state paths
        run: |
          if git ls-files | grep -E '(^|/)(authorized_keys|settings\.reader\.lua|Books|\.kobo)(/|$)|\.(epub|pdf|cbz|cbr|img|key|tgz|zip)$'; then
            echo "Secret, user-content, firmware, or generated artifact path is tracked" >&2
            exit 1
          fi
      - run: python -m build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
